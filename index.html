<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1F24">
<meta name="description" content="Личный кабинет жителя: заявки в УК, показания счётчиков, оплата ЖКУ, аналитика потребления, объявления и опросы дома.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Домовой">
<link rel="stylesheet" href="./styles.css">
<title>Домовой — приложение вашего дома</title>
<!-- Внутри MAX появится window.WebApp. Снаружи скрипта просто не будет,
     и приложение работает как обычный сайт. -->
<script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body>

<div class="app">

  <!--
    Шапка ужата до одной кнопки «Назад».

    Мессенджер уже рисует свою полосу с названием мини-аппа и крестиком,
    и вторая такая же под ней съедала высоту и повторяла то же самое.
    Название раздела теперь стоит первой строкой самой страницы.
  -->
  <header class="app-header">
    <button class="hd-btn" id="hdBackBtn" data-action="back" style="display:none" aria-label="Назад">
      <svg width="16" height="16" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="pages" id="pages"></div>

  <!--
    Заставка при открытии.

    Прячет холодный старт: пока она на экране, приложение успевает
    получить профиль, объекты и начисления. Приветствие переехало сюда
    с главной — там оно занимало строку на каждом заходе, а здесь
    показывается ровно один раз и по делу.
  -->
  <div class="splash" id="splash">
    <div class="splash-logo">
      <!--
        Дом, в котором по очереди зажигаются окна.

        Одна метафора вместо крутящегося кружка: пока приложение
        собирает данные, дом «просыпается». Окна зажигаются с задержкой
        друг за другом, крыша прочерчивается линией — движение занимает
        ровно то время, которое мы всё равно ждём сервер.
      -->
      <svg viewBox="0 0 64 64" fill="none" width="64" height="64" aria-hidden="true">
        <path class="sp-house"
              d="M8 28L32 9L56 28V54C56 55.1 55.1 56 54 56H10C8.9 56 8 55.1 8 54V28Z"
              stroke="currentColor" stroke-width="3"
              stroke-linejoin="round" stroke-linecap="round"/>
        <rect class="sp-win sp-win-1" x="18" y="32" width="10" height="10" rx="2.5" fill="currentColor"/>
        <rect class="sp-win sp-win-2" x="36" y="32" width="10" height="10" rx="2.5" fill="currentColor"/>
        <rect class="sp-win sp-win-3" x="27" y="45" width="10" height="11" rx="2.5" fill="currentColor"/>
      </svg>
    </div>
    <div class="splash-title" id="splashTitle">Домовой</div>
    <div class="splash-greet" id="splashGreet"></div>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="apptabs">
    <button class="apptab active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5L12 4L20 10.5V19.5C20 20 19.6 20.5 19 20.5H5C4.4 20.5 4 20 4 19.5V10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Главная
    </button>
    <button class="apptab" data-tab="requests">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4.5" y="3" width="15" height="18" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 8.5H15.5M8.5 12H15.5M8.5 15.5H12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Обращения
    </button>
    <button class="apptab" data-tab="feed">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 10H16.5M7.5 14H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Дом
    </button>
    <button class="apptab" data-tab="profile">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8"/><path d="M4.8 20C4.8 16 8 14.2 12 14.2C16 14.2 19.2 16 19.2 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Профиль
    </button>
  </nav>
</div>

<script type="module" src="./app/main.js"></script>
</body>
</html>
