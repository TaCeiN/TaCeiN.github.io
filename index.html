<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #000;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
        }

        #play-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }

        #play-overlay.hidden {
            display: none;
        }

        .play-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
        }

        .play-button:hover {
            transform: scale(1.1);
            background: rgba(255, 0, 0, 1);
        }

        .play-button::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 25px 0 25px 45px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 10px;
        }

        .play-text {
            color: white;
            font-size: 1.5rem;
            margin-top: 20px;
            text-align: center;
        }

        .sub-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .error-message {
            color: #ff4444;
            font-size: 1.1rem;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" preload="auto" controls playsinline webkit-playsinline>
            <source src="asset.mp4" type="video/mp4">
            Ваш браузер не поддерживает воспроизведение видео.
        </video>
    </div>
    
    <div id="play-overlay" onclick="startVideo()">
        <div class="play-button"></div>
        <div class="play-text">Нажмите для воспроизведения</div>
        <div class="sub-text">Видео будет воспроизводиться на весь экран</div>
        <div class="error-message" id="error-message"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('play-overlay');
        const errorMessage = document.getElementById('error-message');

        video.addEventListener('error', function(e) {
            console.error('Ошибка загрузки видео:', e);
            errorMessage.textContent = 'Не удалось загрузить видео. Проверьте, что файл asset.mp4 находится в той же директории.';
            errorMessage.style.display = 'block';
        });

        function startVideo() {
            overlay.classList.add('hidden');
            
            const playPromise = video.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Видео успешно запустилось
                    enterFullscreen();
                }).catch(error => {
                    console.error('Автозапуск заблокирован:', error);
                    // Если автозапуск заблокирован, пробуем воспроизвести с звуком выключенным
                    video.muted = true;
                    video.play().then(() => {
                        enterFullscreen();
                    }).catch(() => {
                        // Показываем оверлей обратно если ничего не помогло
                        overlay.classList.remove('hidden');
                        errorMessage.textContent = 'Нажмите на видео для воспроизведения';
                        errorMessage.style.display = 'block';
                    });
                });
            }
        }

        function enterFullscreen() {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            } else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen(); // Для iOS Safari
            } else if (video.msRequestFullscreen) {
                video.msRequestFullscreen();
            }
        }

        // Обработка выхода из полноэкранного режима
        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement && !video.paused) {
                // Видео продолжает воспроизводиться после выхода из fullscreen
            }
        });

        // Двойной клик для полноэкранного режима
        video.addEventListener('dblclick', function() {
            if (!document.fullscreenElement) {
                enterFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
