<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #play-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }

        #play-overlay.hidden {
            display: none;
        }

        .play-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
        }

        .play-button:hover {
            transform: scale(1.1);
            background: rgba(255, 0, 0, 1);
        }

        .play-button::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 25px 0 25px 45px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 10px;
        }

        .play-text {
            color: white;
            font-size: 1.5rem;
            margin-top: 20px;
            text-align: center;
        }

        .sub-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="video-container"></div>
    <div id="play-overlay" onclick="startVideo()">
        <div class="play-button"></div>
        <div class="play-text">Нажмите для воспроизведения</div>
        <div class="sub-text">Видео будет воспроизводиться на весь экран</div>
    </div>

    <script>
        function startVideo() {
            const overlay = document.getElementById('play-overlay');
            overlay.classList.add('hidden');

            const container = document.getElementById('video-container');
            const iframe = document.createElement('iframe');
            iframe.src = 'https://www.youtube.com/embed/9vFoUnkc1HU?list=PLOrk-6uR94K528klxRx7Gat9mHGiJOhK4&autoplay=1&rel=0&modestbranding=1&controls=1&showinfo=0';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;
            container.appendChild(iframe);

            // Попытка войти в полноэкранный режим
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
